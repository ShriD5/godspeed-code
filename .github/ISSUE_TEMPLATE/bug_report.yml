name: Bug report
description: Something in Godspeed is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search existing issues first. For security problems, don't open an issue: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Godspeed version
      description: Godspeed menu → About Godspeed, or `godspeed --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      description: Apple menu → About This Mac. Include the chip (Apple silicon or Intel).
      placeholder: "macOS 27.0, Apple M2"
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Agent
      description: Which agent was the chat using?
      options:
        - Claude Code
        - Codex
        - Cursor
        - Grok Build
        - OpenCode
        - Pi
        - Antigravity
        - Devin
        - Hermes
        - Muse Code
        - Not agent-specific
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: Agent CLI version
      description: For example the output of `claude --version` or `codex --version`.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new chat on ...
        2. Send ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Screenshots help for UI problems.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The desktop app logs to `~/.godspeed/logs/godspeed-headed.log` (the previous launch is in `godspeed-headed.log.old`). The headless engine writes `godspeed-headless.log` in the same folder. If you set `GODSPEED_DATA_DIR`, look in its `logs` folder instead. Paste the relevant lines and remove tokens, emails and private paths first.
      render: text
