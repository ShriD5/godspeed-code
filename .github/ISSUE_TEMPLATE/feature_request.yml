name: Feature request
description: Suggest a new feature or a change to an existing one.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [roadmap](https://github.com/ShriD5/godspeed/blob/main/docs/godspeed/ROADMAP.md) and existing issues first. Some features (plan mode, mid-chat provider switching) were cut on purpose.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like Godspeed to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or how other apps handle it.
  - type: input
    id: agents
    attributes:
      label: Agents involved
      description: If the request is about specific agents, list them.
