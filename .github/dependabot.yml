version: 2
updates:
  # One grouped PR per week with every minor and patch bump in the Cargo
  # workspace. Major bumps are left for manual upgrades because they usually
  # need code changes. Linux CI runs on the PR; add the `full-ci` label to
  # also run the macOS and Windows jobs before merging.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      cargo:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope
