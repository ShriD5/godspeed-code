version: 2
updates:
  # One grouped PR per week with every minor and patch bump in the Cargo
  # workspace. Major bumps are left for manual upgrades because they usually
  # need code changes. CI is off on this repo, so build and test the PR
  # locally before merging (see CONTRIBUTING.md).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      cargo:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope
